<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site Index</title>
  <meta name="description" content="Two websites in this repository: MONROE Modern Grooming and ARRO Logistics." />
  <style>
    :root { --bg: #F3F2EE; --fg: #16181B; --muted: #5F646B; --line: rgba(22, 24, 27, .14); --card: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111315; --fg: #EEF0F2; --muted: #9AA1A9; --line: rgba(238, 240, 242, .14); --card: #1A1D20; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; padding: 32px max(16px, 4vw); }
    main { width: 100%; max-width: 860px; display: grid; gap: 28px; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; }
    p { margin: 0; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    a { display: grid; gap: 6px; height: 100%; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; transition: border-color .2s, transform .2s; }
    a:hover, a:focus-visible { border-color: var(--fg); transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    strong { font-size: 20px; }
    code { font: 13px ui-monospace, Menlo, monospace; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Sites in this repository</h1>
      <p>Each site lives in its own folder and runs on its own.</p>
    </header>
    <ul>
      <li><a href="monroe/index.html"><strong>MONROE Modern Grooming</strong><span>Premium barber studio in Lagos with cut library, portfolios and booking.</span><code>monroe/</code></a></li>
      <li><a href="logistics/index.html"><strong>ARRO Logistics</strong><span>Road, air and sea freight with instant estimates, network map and tracking.</span><code>logistics/</code></a></li>
    </ul>
  </main>
</body>
</html>
